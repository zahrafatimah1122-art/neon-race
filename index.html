    <!-- ===== PANEL LOGIN ===== -->
    <div class="login-panel" id="loginPanel">
      <h2>🔐 LOGIN<br>NEON RACER</h2>
      <input type="text" id="loginName" placeholder="Username (3-12 huruf)" maxlength="12" autocomplete="off" />
      <input type="password" id="loginPass" placeholder="Password" maxlength="32" />
      
      <div class="login-actions">
        <button id="loginBtn" type="button">MASUK</button>
        <button id="registerBtn" class="ghost" type="button">DAFTAR</button>
      </div>
      
      <p class="login-msg" id="loginMsg"></p>
      
      <!-- PERHATIKAN: Tombol tamu saya beri class "ghost small" agar warnanya neon -->
      <button id="guestBtn" class="ghost small" type="button" style="margin-top: 15px;">Main sebagai Tamu →</button>
    </div>
